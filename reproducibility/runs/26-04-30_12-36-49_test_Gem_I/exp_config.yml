exp_description: Gemini | I = SP
split: test
pipeline_config:
  info_extractor_config:
    strategy: GoldInfoExtractor
    dblp_quad_service_name: dblp_quad
    dblp_quad_split_type: test
  entity_linker_config:
    strategy: GoldEntityLinker
    dblp_quad_service_name: dblp_quad
    dblp_quad_split_type: test
  relation_linker_config:
    strategy: FullSchemaRelationLinker
  query_generator_config:
    strategy: LLMQueryGenerator
    llm_service_name: google_llm
    schema_version: dblp_quad
    include_static_few_shot: false
    include_explanation: false
    format_yaml: false
  query_executor_config:
    strategy: EndpointQueryExecutor
    endpoint: http://virtuoso:8890/sparql
    timeout: 20
    local_docker: true
    docker_container_name: dblp-dump-virtuoso-1
    docker_ready_timeout: 60
